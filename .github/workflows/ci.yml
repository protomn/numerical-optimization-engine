name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-14
            os: ubuntu-latest
            cxx: g++-14
            apt: g++-14
          - name: linux-clang-18
            os: ubuntu-latest
            cxx: clang++-18
            apt: clang-18
          - name: macos-appleclang
            os: macos-latest
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      # Provides a Python whose python3-config and pip are both usable, which
      # the Makefile needs for the extension suffix and the pybind11 includes.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Eigen and compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libeigen3-dev ${{ matrix.apt }}

      - name: Install Eigen (macOS)
        if: runner.os == 'macOS'
        run: brew install eigen

      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip pybind11 numpy

      # The Makefile discovers Eigen via pkg-config (falling back to a directory
      # scan) and pybind11 via `python -m pybind11 --includes`, so nothing here
      # hardcodes a path.
      - name: Build
        run: make -j"$(getconf _NPROCESSORS_ONLN)" CXX=${{ matrix.cxx }} PYTHON=python

      # Gates on both the Catch2 suites and the pybind11 binding tests. The
      # stochastic optimisers are seeded in the tests, so this is deterministic.
      - name: Test
        run: make test CXX=${{ matrix.cxx }} PYTHON=python
